# configs/bank_marketing.yaml

dataset:
  name: bank_marketing
  path: data/raw/bank_marketing/bank-full.csv

task:
  type: classification

target:
  column: y

validation:
  test_size: 0.2
  cv_folds: 5
  random_state: 42

preprocessing:
  numeric_imputer: median
  categorical_imputer: most_frequent
  scaling: standard
  encoding: onehot

imbalance:
  method: smote

models:
  - logistic_regression
  - random_forest
  - gradient_boosting
  - svm